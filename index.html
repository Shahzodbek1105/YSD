<style>

.sum{margin:10px 4px 4px;padding-top:12px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut);display:grid;gap:4px}.sum b{color:var(--tx);font-family:var(--mono)}
.bg{display:none;padding:7px 11px}.scrim{display:none}
@media (max-width:820px){
header{padding:10px 14px}
.bg{display:inline-block}
aside{position:fixed;left:0;top:0;bottom:0;max-height:none;width:300px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;background:rgba(7,12,22,.96);backdrop-filter:blur(18px);border-right:1px solid var(--bd);z-index:15;transform:translateX(-105%);transition:transform .25s}
body.open aside{transform:none}
.sbox{min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px))}
body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:14}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button,input{font:inherit;color:var(--tx)}
input{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;min-width:0;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(53,224,255,.18)}
button{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .15s,box-shadow .15s}
button:hover{background:var(--soft);border-color:rgba(53,224,255,.45)}

button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:var(--onac);box-shadow:0 0 22px rgba(53,224,255,.32)}

button.d{color:var(--bad);background:transparent}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 40px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 150px}
.item{display:block;padding:14px;margin:0 -6px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--bd)}
.item:hover{background:var(--soft)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px}.r{text-align:right;white-space:nowrap;font-family:var(--mono)}

.stat b{display:block;font:600 22px var(--mono);color:var(--tx);margin-top:4px;text-shadow:0 0 18px rgba(53,224,255,.4)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.crumbs{margin-bottom:14px;color:var(--mut);font-size:14px}.crumbs a{color:var(--ac);cursor:pointer;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:11px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:500;font-size:12.5px}tr:last-child td{border:0}
.empty{text-align:center;color:var(--mut);padding:28px 0}
.fl{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod{position:fixed;inset:0;z-index:20;background:rgba(3,6,12,.85);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:20px}
.mod img{max-width:100%;max-height:80vh;border-radius:12px}.mod a{color:#fff;font-weight:600}
.stat.ed{cursor:pointer;border-style:dashed}.stat.ed:hover{border-color:var(--ac)}
.pc{font:500 12px var(--mono,ui-monospace,Consolas,monospace);font-style:normal;color:var(--mut);margin-left:4px;text-shadow:none}
select{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;color:var(--tx);font:inherit;min-width:0}
</style></head><body>
<header><div class="row" style="flex-wrap:nowrap"><button class="bg" data-a="menu">☰</button><h1><i>YSD</i>Бухгалтерия YSD</h1></div>
<div class="row"><span id="st" class="mut"></span><button class="p" id="sy">🔄 Синхронизировать</button><button id="cfg" title="Настройки">⚙</button><button id="lk" title="Заблокировать">🔒</button><button id="exp" title="Сохранить файл" aria-label="Сохранить файл">⬇</button><button id="imp" title="Загрузить файл" aria-label="Загрузить файл">⬆</button><input type="file" id="file" accept=".json" hidden></div></header>
<div class="layout"><aside id="side"></aside><main id="app"></main></div><div class="scrim" data-a="close"></div>
<input type="file" id="af" accept="image/*,application/pdf" hidden><input type="file" id="df" hidden>
<script>
const KEY="ysd_buh_v1",FN="Бухгалтерия YSD.json";
let db={sections:[]},view={s:null,c:null};

const uid=()=>Math.random().toString(36).slice(2,10);
const save=()=>{store(track())};
const fmt=n=>(Number(n)||0).toLocaleString("ru-RU",{maximumFractionDigits:2});
const pct=(a,b)=>b>0?(Math.round((Number(a)||0)/b*1000)/10).toLocaleString("ru-RU")+"%":"—";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((x,y)=>x+(Number(y.amount)||0),0);
const spent=c=>sum(c.expenses),total=s=>sum(s.contracts),tspent=s=>s.contracts.reduce((x,c)=>x+spent(c),0);
const bal=(a,b)=>`<span class="${a-b<0?'bad':'ok'}">${fmt(a-b)}</span>`;
const have=c=>c.received==null?(+c.amount||0):(+c.received||0),totalHave=s=>s.contracts.reduce((x,c)=>x+have(c),0);
const restCash=c=>c.cash==null?have(c)-spent(c):(+c.cash||0);
const pg=(a,b)=>{const p=a>0?Math.min(100,b/a*100):0;return `<div class="bar"><span class="${b>a?"over":""}" style="width:${p}%"></span></div>`};
let pend=null,attachId=null;const coll={};
async function shrink(f){if(!f.type.startsWith("image/"))return f;try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));return new File([bl],f.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"})}catch(e){return f}}
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
function form(title,fields,ok){const m=document.createElement("div");m.className="mod";
 m.innerHTML=`<div class="card" style="width:min(420px,100%);margin:0"><h2 style="font-size:18px">${title}</h2><div style="display:grid;gap:10px;margin:14px 0">${fields.map(f=>`<label class="mut">${f.l}<input data-k="${f.k}" type="${f.t||"text"}" value="${esc(f.v)}" style="width:100%;margin-top:4px"></label>`).join("")}</div><div class="row"><button class="p" id="ok">Сохранить</button><button id="no">Отмена</button></div></div>`;
 m.onclick=e=>{if(e.target===m)m.remove()};m.querySelector("#no").onclick=()=>m.remove();
 m.querySelector("#ok").onclick=()=>{const o={};m.querySelectorAll("input").forEach(i=>o[i.dataset.k]=i.value.trim());ok(o);m.remove()};
 document.body.appendChild(m)}
const S=()=>db.sections.find(x=>x.id===view.s),C=()=>S()?.contracts.find(x=>x.id===view.c);
function go(s,c){view={s:s||null,c:c||null};document.body.classList.remove("open");render();scrollTo(0,0)}
function side(){
 const all=db.sections.reduce((x,y)=>x+total(y),0),sp=db.sections.reduce((x,y)=>x+tspent(y),0),hv=db.sections.reduce((x,y)=>x+totalHave(y),0);
 document.getElementById("side").innerHTML=`<div class="card sbox"><div class="sh">Меню</div>
 <a class="nv ${!view.s&&!view.a?"on":""}" data-a="home"><span>🏠 Обзор</span></a><a class="nv ${view.a?"on":""}" data-a="arch"><span>🗄 Архив</span><small>${db.sections.reduce((n,x)=>n+x.contracts.filter(c=>c.closed).length,0)}</small></a><div class="sh" style="margin-top:8px">Разделы</div>
 ${db.sections.map(x=>`<a class="nv ${view.s===x.id&&!view.c?"on":""}" data-a="openS" data-id="${x.id}"><span>📁 ${esc(x.name)}</span><small>${x.contracts.filter(c=>!c.closed).length}${view.s===x.id?(coll[x.id]?" ▸":" ▾"):""}</small></a>${view.s===x.id&&!coll[x.id]?x.contracts.filter(c=>!c.closed).map(c=>`<a class="nv sub ${view.c===c.id?"on":""}" data-a="openC" data-s="${x.id}" data-id="${c.id}"><span>📄 ${esc(c.name)}</span></a>`).join(""):""}`).join("")}
 <div class="sum" style="margin-top:auto"><div>Всего по договорам <b>${fmt(all)}</b></div><div>Наличие суммы <b>${fmt(hv)} <i class="pc">${pct(hv,all)}</i></b></div><div>Всего расходов <b>${fmt(sp)}</b></div><div>Остаток <b>${bal(hv,sp)}</b></div><div>Наличие остатка <b>${fmt(db.sections.reduce((x,y)=>x+y.contracts.reduce((a,c)=>a+restCash(c),0),0))}</b></div></div>
 <button class="p" data-a="newS" style="width:100%;margin-top:14px">＋ Новый раздел</button></div>`}
function docsCard(c){
 const D=c.docs||{other:[]},ia=i=>i!=null?` data-i="${i}"`:"";
 const row=(l,k,r,i)=>`<div class="item" style="cursor:default;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="min-width:0"><b>${l}</b><div class="mut" style="overflow-wrap:anywhere">${r?esc(r.name):"не прикреплён"}</div></div><div class="row">${r?`<button data-a="vdoc" data-k="${k}"${ia(i)}>Открыть</button>`:""}${k==="other"?"":`<button data-a="adoc" data-k="${k}">${r?"Заменить":"📎 Прикрепить"}</button>`}${r?`<button class="d" data-a="ddoc" data-k="${k}"${ia(i)}>✕</button>`:""}</div></div>`;
 return `<div class="card"><h2 style="font-size:18px">Документы договора</h2>${row("Договор","contract",D.contract)}${row("Техническое задание (ТЗ)","tz",D.tz)}${(D.other||[]).map((r,i)=>row("Прочий документ","other",r,i)).join("")}<div class="row" style="margin-top:12px"><button data-a="adoc" data-k="other">＋ Добавить прочие документы</button><span class="mut">можно выбрать несколько файлов</span></div></div>`}
async function viewDoc(r){
 let b=null;try{b=await getBlob(r)}catch(e){notice("Не удалось получить файл: "+e.message)}
 const u=b?URL.createObjectURL(b):"",ty=(b&&b.type)||r.type||"",m=document.createElement("div");m.className="mod";
 m.innerHTML=(b?(ty.startsWith("image/")?`<img src="${u}">`:`<a href="${u}" target="_blank" rel="noopener" download="${esc(r.name)}">Открыть: ${esc(r.name)}</a>`):`<div style="color:#fff;text-align:center;max-width:320px">Файл недоступен на этом устройстве. Нажмите «Синхронизировать» или прикрепите заново.</div>`)+`<div class="row"><button>Закрыть</button></div>`;
 m.onclick=()=>{if(u)URL.revokeObjectURL(u);m.remove()};document.body.appendChild(m)}
function ask(t){return new Promise(res=>{const m=document.createElement("div");m.className="mod";
 m.innerHTML=`<div class="card" style="margin:0;max-width:360px;text-align:center"><div style="margin-bottom:16px">${esc(t)}</div><div class="row" style="justify-content:center"><button class="p" id="ay">Да</button><button id="an">Отмена</button></div></div>`;
 const end=v=>{m.remove();res(v)};m.querySelector("#ay").onclick=()=>end(true);m.querySelector("#an").onclick=()=>end(false);m.onclick=e=>{if(e.target===m)end(false)};document.body.appendChild(m)})}
function notice(t){const m=document.createElement("div");m.className="mod";
 m.innerHTML=`<div class="card" style="margin:0;max-width:380px;text-align:center"><div style="margin-bottom:16px">${esc(t)}</div><button class="p" id="ay">OK</button></div>`;
 m.querySelector("#ay").onclick=()=>m.remove();document.body.appendChild(m)}
let docTarget="other";
function render(){
 const app=document.getElementById("app");let h="";
 const s=S(),c=s&&C();
 if(view.a){
  h+=`<div class="card"><h2>Архив договоров</h2><div class="mut">Закрытые договоры по разделам</div></div>`;
  const g=db.sections.filter(x=>x.contracts.some(c=>c.closed));
  h+=g.length?g.map(x=>`<div class="card"><h2 style="font-size:18px">${esc(x.name)}</h2>${x.contracts.filter(c=>c.closed).sort((a,b)=>b.closed-a.closed).map(c=>`<div class="item" data-a="openC" data-s="${x.id}" data-id="${c.id}"><div class="top"><div><b>${esc(c.name)}</b><div class="mut">Закрыт ${new Date(c.closed).toLocaleDateString("ru-RU")} · расходы ${fmt(spent(c))}</div></div><div class="r"><b>${fmt(c.amount)}</b><div class="mut">наличие ${fmt(have(c))} (${pct(have(c),c.amount)})</div></div></div></div>`).join("")}</div>`).join(""):`<div class="empty">В архиве пока нет договоров</div>`;
 }else if(!s){
  h+=`<div class="card"><h2>Разделы</h2><div class="row" style="margin:12px 0 8px"><input id="n" placeholder="Название раздела, напр. Кыргыз комур"><button class="p" data-a="addS">Создать раздел</button></div>`;
  h+=db.sections.length?db.sections.map(x=>`<div class="item" data-a="openS" data-id="${x.id}"><div class="top"><div><b>${esc(x.name)}</b><div class="mut">Договоров: ${x.contracts.filter(c=>!c.closed).length}</div></div><div class="r"><b>${fmt(total(x))}</b><div class="mut">расходы ${fmt(tspent(x))}</div></div></div>${pg(totalHave(x),tspent(x))}</div>`).join(""):`<div class="empty">Пока нет разделов. Создайте первый 👆</div>`;
  h+=`</div>`;
 }else if(!c){
  h+=`<div class="crumbs"><a data-a="home">Разделы</a> / ${esc(s.name)}</div><div class="card"><h2>${esc(s.name)}</h2>
  <div class="stats"><div class="stat">Сумма договоров<b>${fmt(total(s))}</b></div><div class="stat">Наличие суммы<b>${fmt(totalHave(s))} <i class="pc">${pct(totalHave(s),total(s))}</i></b></div><div class="stat">Расходы<b>${fmt(tspent(s))}</b></div><div class="stat">Остаток<b>${bal(totalHave(s),tspent(s))}</b></div><div class="stat">Наличие остатка<b>${fmt(s.contracts.reduce((x,c)=>x+restCash(c),0))}</b></div></div>
  <div class="row"><input id="n" placeholder="Название / № договора"><input id="a" type="number" placeholder="Сумма договора"><input id="r" type="number" placeholder="Наличие суммы"><button class="p" data-a="addC">Добавить договор</button></div></div>

  h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}

async function kdf(pass,salt,alg){
 const te=new TextEncoder();
 if(alg==="j"||!hasSubtle()){let x=te.encode(salt+":"+pass);const sb=te.encode(salt);
  for(let i=0;i<20000;i++){const y=new Uint8Array(x.length+sb.length);y.set(x);y.set(sb,x.length);x=sha256b(y)}return hexs(x)}

 o.querySelector("form").onsubmit=async ev=>{

}
